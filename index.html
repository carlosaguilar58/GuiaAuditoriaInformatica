<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Examen - Auditoría Informática (ISO 27001:2022)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        h1, h3 {
            text-align: center;
            color: #2c3e50;
        }
        .quiz-container {
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .question-block {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }
        .question-text {
            font-size: 1.1em;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .option-btn {
            display: block;
            width: 100%;
            text-align: left;
            background-color: #ecf0f1;
            border: 1px solid #bdc3c7;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.2s;
        }
        .option-btn:hover {
            background-color: #dcdde1;
        }
        .option-btn.selected {
            background-color: #3498db;
            color: white;
            border-color: #2980b9;
        }
        .option-btn.correct {
            background-color: #2ecc71;
            color: white;
            border-color: #27ae60;
        }
        .option-btn.incorrect {
            background-color: #e74c3c;
            color: white;
            border-color: #c0392b;
        }
        .score-display {
            text-align: center;
            font-size: 1.5em;
            font-weight: bold;
            margin-top: 20px;
            display: none;
        }
        .submit-btn, .reload-btn {
            display: block;
            width: 100%;
            padding: 15px;
            font-size: 1.2em;
            color: white;
            background-color: #2c3e50;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }
        .submit-btn:hover, .reload-btn:hover {
            background-color: #1a252f;
        }
        .reload-btn {
            background-color: #e67e22;
            display: none;
        }
    </style>
</head>
<body>

    <h1>Guía de Estudio: ISO/IEC 27001:2022</h1>
    <h3>Auditoría Informática</h3>
    
    <div class="quiz-container" id="quiz-container">
        <!-- Las preguntas se inyectarán aquí -->
    </div>

    <button class="submit-btn" id="submit-btn" onclick="checkAnswers()">Calificar Examen</button>
    <div class="score-display" id="score-display"></div>
    <button class="reload-btn" id="reload-btn" onclick="location.reload()">Generar Nuevo Examen Aleatorio</button>

    <script>
        const rawQuestions = [
            { q: "¿Qué especifica la norma NTP-ISO/IEC 27001:2022?", a: "Requisitos para sistemas de gestión de seguridad de la información.", wrong: ["Controles detallados de seguridad perimetral.", "Técnicas criptográficas para protección de datos.", "Guías de auditoría financiera para TI."] },
            { q: "De acuerdo a la Enmienda 1:2024 (Cláusula 4.1), ¿qué nuevo elemento debe determinar la organización?", a: "Si el cambio climático es una cuestión pertinente.", wrong: ["Si la inteligencia artificial afecta las operaciones.", "La huella de carbono de los centros de datos.", "El presupuesto anual de ciberseguridad."] },
            { q: "¿Qué cláusula exige comprender las necesidades y expectativas de las partes interesadas?", a: "Cláusula 4.2", wrong: ["Cláusula 5.1", "Cláusula 6.1", "Cláusula 8.2"] },
            { q: "¿Qué documento debe contener los límites y aplicabilidad del SGSI según la cláusula 4.3?", a: "El alcance del SGSI.", wrong: ["La política de seguridad de la información.", "La declaración de aplicabilidad (SoA).", "El registro de riesgos."] },
            { q: "Según la cláusula 5.1, ¿quién debe demostrar compromiso con el SGSI?", a: "La alta dirección.", wrong: ["El auditor interno.", "El administrador de TI.", "El proveedor de servicios en la nube."] },
            { q: "¿Qué requisito exige explícitamente la cláusula 5.2 sobre la política de seguridad?", a: "Estar disponible como información documentada.", wrong: ["Estar escrita únicamente en lenguaje técnico.", "Ser aprobada por una entidad gubernamental.", "Ser renovada cada seis meses exactos."] },
            { q: "Asignar autoridades para informar sobre el desempeño del SGSI es un requisito de la cláusula:", a: "5.3 Roles, responsabilidades y autoridades.", wrong: ["7.2 Competencia.", "9.2 Auditoría interna.", "4.4 Sistema de gestión."] },
            { q: "¿Qué busca determinar la organización al planificar el SGSI en la cláusula 6.1.1?", a: "Riesgos y oportunidades que necesitan ser abordados.", wrong: ["Exclusivamente las amenazas tecnológicas.", "El presupuesto necesario para el software.", "El número de empleados a capacitar."] },
            { q: "Según la cláusula 6.1.2, ¿qué debe establecer el proceso de evaluación de riesgos?", a: "Criterios de aceptación del riesgo.", wrong: ["El proveedor del software antivirus.", "El código fuente de las aplicaciones.", "Los turnos de guardia del personal."] },
            { q: "En el tratamiento de riesgos (6.1.3), ¿con qué se deben comparar los controles seleccionados?", a: "Con los controles del Anexo A de la norma.", wrong: ["Con las normativas financieras locales.", "Con las políticas de recursos humanos.", "Con los estándares de cableado de red."] },
            { q: "¿Qué documento formal exige la cláusula 6.1.3 y justifica la inclusión o exclusión de controles?", a: "La Declaración de Aplicabilidad (SoA).", wrong: ["El Plan de Continuidad del Negocio.", "El Acuerdo de Nivel de Servicio (SLA).", "El Manual de Usuario del SGSI."] },
            { q: "De acuerdo a la cláusula 6.2, los objetivos de seguridad de la información deben:", a: "Ser medibles (si es posible) y coherentes con la política.", wrong: ["Ser confidenciales para todo el personal operativo.", "Estar enfocados únicamente en la infraestructura física.", "Aplicar solamente al departamento de sistemas."] },
            { q: "Si se determinan cambios en el SGSI, la cláusula 6.3 exige que se lleven a cabo de manera:", a: "Planificada.", wrong: ["Inmediata y reactiva.", "Externalizada a consultores.", "Aleatoria según la disponibilidad."] },
            { q: "¿Qué exige la cláusula 7.2 (Competencia) conservar como evidencia?", a: "Información documentada apropiada de la competencia.", wrong: ["Copias de los títulos universitarios impresos.", "Exámenes médicos del personal de TI.", "Fotografías de las áreas de trabajo."] },
            { q: "Según la cláusula 7.3, ¿de qué deben tomar conciencia las personas que trabajan en la organización?", a: "Su contribución a la eficacia del SGSI.", wrong: ["La configuración exacta de los firewalls.", "Los presupuestos anuales de tecnología.", "El código de ética contable de la empresa."] },
            { q: "¿Qué cláusula exige determinar qué, cuándo, con quién y cómo comunicarse?", a: "Cláusula 7.4 (Comunicación).", wrong: ["Cláusula 8.1 (Control operacional).", "Cláusula 5.2 (Política).", "Cláusula 9.3 (Revisión)."] },
            { q: "La información documentada requerida por el SGSI debe controlarse para asegurar (Cláusula 7.5.3):", a: "Que esté disponible, adecuada y protegida.", wrong: ["Que sea pública en el sitio web corporativo.", "Que esté impresa bajo llave en bóvedas.", "Que se elimine anualmente por defecto."] },
            { q: "¿Qué exige la cláusula 8.1 (Planificación y control operacional) frente a los cambios no intencionados?", a: "Revisar las consecuencias y actuar para mitigar efectos.", wrong: ["Despedir al personal responsable del cambio.", "Ignorarlos si no afectan la operatividad inmediata.", "Documentarlos en la política general."] },
            { q: "La organización debe realizar evaluaciones de riesgos a intervalos planificados o cuando:", a: "Se propongan u ocurran cambios significativos.", wrong: ["Lo solicite un medio de comunicación externo.", "Fallezca el director de la empresa.", "Haya cambio de horario de verano."] },
            { q: "¿Qué exige la cláusula 9.1 sobre el seguimiento y medición?", a: "Determinar métodos para asegurar resultados válidos.", wrong: ["Contratar exclusivamente auditores externos.", "Medir el tráfico de internet cada segundo.", "Publicar los resultados en redes sociales."] },
            { q: "Las auditorías internas (Cláusula 9.2) tienen como propósito verificar si el SGSI:", a: "Está conforme a los requisitos de la organización y la norma.", wrong: ["Supera tecnológicamente a la competencia directa.", "Consume menos del 5% del presupuesto general.", "Está exento de cualquier amenaza existente."] },
            { q: "Según la cláusula 9.3, ¿quién debe realizar la revisión del SGSI a intervalos planificados?", a: "La alta dirección.", wrong: ["El administrador de bases de datos.", "El departamento de recursos humanos.", "El auditor externo de certificación."] },
            { q: "¿Cuál es una entrada obligatoria para la revisión por la dirección según 9.3.2?", a: "El estado de las acciones de revisiones anteriores.", wrong: ["El registro de asistencia del personal de limpieza.", "El inventario de licencias de ofimática.", "El reporte de ventas trimestrales."] },
            { q: "Cuando ocurre una no conformidad, la organización debe (Cláusula 10.2):", a: "Reaccionar, evaluar causas e implementar acciones.", wrong: ["Aceptar el riesgo sin documentarlo previamente.", "Suspender inmediatamente todas las operaciones.", "Cambiar la política de seguridad por completo."] },
            { q: "¿Cuál de los siguientes es un atributo de seguridad introducido para los controles del Anexo A?", a: "Tipo de control (Preventivo, Detectivo, Correctivo).", wrong: ["Tipo de hardware (Servidor, Switch, Router).", "Nivel de empleado (Junior, Semi-Senior, Senior).", "Costo de implementación (Bajo, Medio, Alto)."] },
            { q: "El control A.5.1 'Políticas para la seguridad de la información' es un control de tipo:", a: "Organizacional.", wrong: ["Tecnológico.", "Físico.", "De personal."] },
            { q: "Según el control A.5.7, la información de amenazas debe recopilarse y analizarse para producir:", a: "Inteligencia de amenazas.", wrong: ["Sanciones disciplinarias.", "Reportes financieros.", "Campañas de marketing."] },
            { q: "El control A.5.14 sobre 'Transferencia de información' exige:", a: "Reglas o acuerdos para instalaciones de transferencia.", wrong: ["Prohibir totalmente el uso de correos electrónicos.", "Transferir datos exclusivamente en discos duros.", "Eliminar el cifrado para facilitar la lectura."] },
            { q: "El control A.5.34 trata sobre el cumplimiento legal respecto a:", a: "Privacidad y protección de la IIP.", wrong: ["Normativas de construcción de oficinas.", "Leyes de importación de hardware tecnológico.", "Regulaciones de salud ocupacional."] },
            { q: "¿A qué categoría del Anexo A pertenece el control A.6.1 'Investigación de antecedentes'?", a: "Controles de personal.", wrong: ["Controles físicos.", "Controles tecnológicos.", "Controles organizacionales."] },
            { q: "Según el control A.6.8, la organización debe proporcionar un mecanismo para que el personal:", a: "Reporte eventos de seguridad observados o bajo sospecha.", wrong: ["Modifique las reglas del firewall corporativo.", "Instale software sin autorización previa.", "Audite a la alta dirección anualmente."] },
            { q: "El control A.7.7 exige implementar reglas sobre:", a: "Escritorio y pantalla limpios.", wrong: ["Uso exclusivo de dispositivos móviles personales.", "Vestimenta formal en el centro de datos.", "Horarios fijos de alimentación del personal."] },
            { q: "De acuerdo al control A.7.11, las instalaciones deben protegerse de:", a: "Cortes de energía y fallas en servicios de apoyo.", wrong: ["Auditorías internas no programadas previamente.", "Actualizaciones de software en la nube.", "Sincronización de relojes."] },
            { q: "El control A.8.13 exige mantener y probar de acuerdo con una política:", a: "Las copias de respaldo de la información y sistemas.", wrong: ["Las claves maestras del centro de datos.", "Los manuales impresos de recursos humanos.", "Los contratos de arrendamiento de la oficina."] },
            { q: "Según el control A.8.15 'Registro', se deben producir, almacenar, proteger y analizar:", a: "Registros que guarden actividades, excepciones y fallas.", wrong: ["Videos de vigilancia de las áreas públicas.", "Registros de llamadas personales del equipo.", "Historiales médicos de la alta dirección."] },
            { q: "El control A.8.20 indica que se deben proteger, administrar y controlar:", a: "Las redes y dispositivos de red.", wrong: ["Los comedores y áreas de descanso.", "Los sistemas de nómina de la competencia.", "Los vehículos de transporte de la empresa."] },
            { q: "Para el desarrollo de software, el control A.8.29 exige aplicar:", a: "Principios de codificación segura.", wrong: ["Lenguajes de programación obsoletos para ahorro.", "Metodologías de venta directa al cliente.", "Sistemas de refrigeración por líquido."] },
            { q: "¿Qué exige el control A.8.31 sobre los entornos de desarrollo, prueba y producción?", a: "Deben estar separados y protegidos.", wrong: ["Deben estar unificados en un solo servidor físico.", "Deben ser accesibles por cualquier empleado.", "Deben estar ubicados en distintos países siempre."] },
            { q: "¿En qué capítulo de la ISO 27001 se exigen auditorías internas y revisiones por la dirección?", a: "Capítulo 9: Evaluación del desempeño.", wrong: ["Capítulo 4: Contexto de la organización.", "Capítulo 6: Planificación.", "Capítulo 8: Operación."] },
            { q: "La norma ISO/IEC 27001 utiliza el ciclo PHVA. ¿A qué fase corresponde el Capítulo 10 (Mejora)?", a: "Fase de Actuar (Act).", wrong: ["Fase de Planificar (Plan).", "Fase de Hacer (Do).", "Fase de Verificar (Check)."] }
        ];

        // Función para inyectar caracteres invisibles y fijar a exactamente 150 caracteres
        function equalizeLength(text) {
            const targetLength = 150;
            if (text.length >= targetLength) return text.substring(0, targetLength);
            // ZERO WIDTH SPACE (\u200B) no afecta el diseño visual
            const padding = '\u200B'.repeat(targetLength - text.length); 
            return text + padding;
        }

        // Barajar array
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        let formattedQuestions = [];

        function buildQuiz() {
            formattedQuestions = rawQuestions.map(q => {
                let options = [
                    { text: equalizeLength(q.a), correct: true },
                    { text: equalizeLength(q.wrong[0]), correct: false },
                    { text: equalizeLength(q.wrong[1]), correct: false },
                    { text: equalizeLength(q.wrong[2]), correct: false }
                ];
                shuffleArray(options);
                return { question: q.q, options: options };
            });

            shuffleArray(formattedQuestions);

            const container = document.getElementById('quiz-container');
            container.innerHTML = '';

            formattedQuestions.forEach((qData, qIndex) => {
                let qDiv = document.createElement('div');
                qDiv.className = 'question-block';
                
                let qText = document.createElement('div');
                qText.className = 'question-text';
                qText.innerText = `${qIndex + 1}. ${qData.question}`;
                qDiv.appendChild(qText);

                qData.options.forEach((opt, oIndex) => {
                    let btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerText = opt.text;
                    btn.dataset.correct = opt.correct;
                    btn.dataset.qindex = qIndex;
                    
                    btn.onclick = function() {
                        // Deseleccionar otras opciones en la misma pregunta
                        const siblings = qDiv.querySelectorAll('.option-btn');
                        siblings.forEach(s => s.classList.remove('selected'));
                        this.classList.add('selected');
                    };

                    qDiv.appendChild(btn);
                });
                
                container.appendChild(qDiv);
            });
        }

        function checkAnswers() {
            let score = 0;
            const container = document.getElementById('quiz-container');
            const questions = container.querySelectorAll('.question-block');

            questions.forEach(qDiv => {
                const buttons = qDiv.querySelectorAll('.option-btn');
                let answered = false;

                buttons.forEach(btn => {
                    btn.disabled = true; // Desactivar clics después de calificar
                    if (btn.classList.contains('selected')) {
                        answered = true;
                        if (btn.dataset.correct === "true") {
                            btn.classList.add('correct');
                            score++;
                        } else {
                            btn.classList.add('incorrect');
                        }
                    }
                    // Mostrar cuál era la correcta
                    if (btn.dataset.correct === "true" && !btn.classList.contains('selected')) {
                        btn.style.border = "2px solid #2ecc71";
                        btn.style.backgroundColor = "#e8f8f5";
                    }
                });
            });

            const scoreDisplay = document.getElementById('score-display');
            scoreDisplay.style.display = 'block';
            scoreDisplay.innerText = `Calificación Final: ${score} / 40 (${((score/40)*100).toFixed(0)}%)`;
            
            document.getElementById('submit-btn').style.display = 'none';
            document.getElementById('reload-btn').style.display = 'block';
            window.scrollTo(0, document.body.scrollHeight);
        }

        // Iniciar examen al cargar
        window.onload = buildQuiz;
    </script>
</body>
</html>
