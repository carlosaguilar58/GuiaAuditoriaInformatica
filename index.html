        // Función para inyectar caracteres invisibles y evitar que se adivine por longitud
        function equalizeLength(text) {
            const targetLength = 155; 
            if (text.length >= targetLength) return text.substring(0, targetLength);
            const padding = '\u200B'.repeat(targetLength - text.length); 
            return text + padding;
        }

        // Función para barajar los arrays (preguntas y respuestas)
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        let formattedItems = [];

        function buildQuiz() {
            // Preparar y barajar opciones
            formattedItems = rawItems.map(item => {
                let options = item.options.map(opt => ({
                    text: equalizeLength(opt.text),
                    correct: opt.correct
                }));
                shuffleArray(options);
                return { ...item, options: options };
            });

            // Barajar el orden de los 40 reactivos (casos + teoría mezclados)
            shuffleArray(formattedItems);

            const container = document.getElementById('quiz-container');
            container.innerHTML = '';

            formattedItems.forEach((itemData, index) => {
                let qDiv = document.createElement('div');
                qDiv.className = 'question-block';
                qDiv.dataset.type = itemData.type;
                
                let titleText = document.createElement('div');
                titleText.className = 'question-title';
                titleText.innerText = `${index + 1}. ${itemData.title}`;
                qDiv.appendChild(titleText);

                let caseText = document.createElement('div');
                caseText.className = 'question-text';
                // Si es un caso, mantener la cursiva y el fondo, si es teoría, que sea normal.
                if(itemData.title === "Pregunta Teórica") {
                    caseText.style.fontStyle = "normal";
                    caseText.style.background = "#fff";
                    caseText.style.borderLeft = "none";
                    caseText.style.padding = "0";
                }
                caseText.innerText = itemData.text;
                qDiv.appendChild(caseText);

                let instruction = document.createElement('div');
                instruction.className = 'instruction';
                instruction.innerText = itemData.type === 'single' ? "Selecciona la respuesta correcta (Única):" : "Selecciona todas las respuestas correctas (Múltiple):";
                qDiv.appendChild(instruction);

                itemData.options.forEach((opt) => {
                    let btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerText = opt.text;
                    btn.dataset.correct = opt.correct;
                    
                    btn.onclick = function() {
                        if (itemData.type === 'single') {
                            const siblings = qDiv.querySelectorAll('.option-btn');
                            siblings.forEach(s => s.classList.remove('selected'));
                            this.classList.add('selected');
                        } else {
                            this.classList.toggle('selected');
                        }
                    };

                    qDiv.appendChild(btn);
                });
                
                container.appendChild(qDiv);
            });
        }

        function checkAnswers() {
            let score = 0;
            const container = document.getElementById('quiz-container');
            const questions = container.querySelectorAll('.question-block');

            questions.forEach(qDiv => {
                const buttons = qDiv.querySelectorAll('.option-btn');
                let isCorrect = true;
                let hasSelection = false;

                buttons.forEach(btn => {
                    btn.disabled = true; // Deshabilitar clics
                    const isSelected = btn.classList.contains('selected');
                    const isActuallyCorrect = btn.dataset.correct === "true";

                    if (isSelected) hasSelection = true;

                    if (isSelected && isActuallyCorrect) {
                        btn.classList.add('correct');
                    } else if (isSelected && !isActuallyCorrect) {
                        btn.classList.add('incorrect');
                        isCorrect = false; 
                    } else if (!isSelected && isActuallyCorrect) {
                        btn.style.border = "2px solid #2ecc71";
                        btn.style.backgroundColor = "#e8f8f5";
                        isCorrect = false; 
                    }
                });

                if (isCorrect && hasSelection) score++;
            });

            const scoreDisplay = document.getElementById('score-display');
            scoreDisplay.style.display = 'block';
            scoreDisplay.innerText = `Calificación Final: ${score} / 40 (${((score/40)*100).toFixed(0)}%)`;
            
            document.getElementById('submit-btn').style.display = 'none';
            document.getElementById('reload-btn').style.display = 'block';
            window.scrollTo(0, document.body.scrollHeight);
        }

        window.onload = buildQuiz;
    </script>
</body>
</html>
